<!--
  The dot alone (design 16d).

  Below about 18px the caps stop holding, so at favicon size the mark is the
  dot by itself — one amber disc, no letter inside it. The indigo circle with
  an R that used to sit here was a scaffold default and was never the brand.

  A literal rather than a token: a favicon is fetched as its own document and
  never sees the app's stylesheets. This is #c87941, the sRGB value of the
  dark workspace's --accent, which is the amber the design draws the dot in.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <circle cx="16" cy="16" r="16" fill="#c87941" />
</svg>
