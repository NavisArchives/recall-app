<!doctype html>
<!--
  Begin hier — the archive on the stick (design "Recall Archief Editie").

  Three screens in one file, reached by the address bar's #hash so the back
  button works and a chapter can be bookmarked:

    #            the cover — one photograph, the name, and a way in
    #overzicht   the channels, as cards on warm paper
    #01 … #99    one channel, in the display's own dark language

  THE RULES THIS FILE KEEPS, all of them load-bearing:

    · the archive's data is INLINE, in the script tag at the end. The page
      runs from a file:// origin, where browsers refuse network requests. A
      data.json beside this file would render a blank page on a kitchen table
      and pass every test served over localhost. (This note spells the
      request function without its bracket on purpose: the mission's check
      greps for exactly that, and a comment must not be what answers it.)
    · nothing is loaded from anywhere. No CDN, no font host, no icon set, no
      analytics. "Recall Archivo" and "Recall Mono" lead each stack so that
      dropping two woff2 payloads into the EMBED SLOT below would be all it
      takes to carry the real faces; until then every machine falls through to
      Helvetica / Arial / Liberation Sans and ui-monospace, which are already
      on it and therefore always arrive.
    · photographs, recordings and the contributors' faces are ordinary files
      beside this one, referenced by relative, URL-encoded path.
    · DATES ARE NOT BAKED. Each photograph carries its ISO date and how much
      of it the family actually told us; the page prints the month when a
      month is all that was chosen, and never a day nobody picked. The stick
      outlives the software, so a date it states wrongly is wrong for good.
    · the language switch changes THIS PAGE'S OWN WORDS — the labels, the
      dates, the counts. It never touches a caption, a title or a name: the
      family wrote those, and translating someone's words for them is the one
      thing an archive must not do.

  Placeholders the exporter fills: {{SUBJECT}} and {{ARCHIVE_JSON}}.
-->
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Het archief van {{SUBJECT}}</title>
    <style>
      /* EMBED SLOT — paste the woff2 payloads here and the file stays fully offline:
         @font-face{font-family:"Recall Archivo";src:url(data:font/woff2;base64,…) format("woff2");font-weight:400 700;font-display:block}
         @font-face{font-family:"Recall Mono";src:url(data:font/woff2;base64,…) format("woff2");font-weight:400 500;font-display:block} */

      :root {
        --paper: #f7f3eb;
        --ink: #14130f;
        --accent: #c13b22;
        --plate-no: #e0705c;
        --dark: #0b0b0c;
        --backing: #1a1713;
        --sans: "Recall Archivo", "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
        --mono: "Recall Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }

      html, body { margin: 0; padding: 0; background: var(--dark); }
      body {
        font-family: var(--sans);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      img, video { display: block; }
      button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }

      @keyframes ed-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes ed-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes ed-zoom { from { transform: scale(1.06); } to { transform: scale(1); } }

      /* The mark: RECALL and its full stop. The dot never touches the L — it
         is a separate element with its own gap, which is what the owner asked
         for when the wordmark was drawn. */
      .mark { display: inline-flex; align-items: baseline; gap: 2.8px; }
      /* Light, always. Every screen here stands on a dark ground, and this
         inherited the body's ink on the overview — RECALL in near-black on a
         near-black page. */
      .mark b { font: 600 15px/1 var(--sans); letter-spacing: .12em; color: var(--paper); }
      .mark i { width: 3px; height: 3px; border-radius: 50%; background: var(--accent); }

      /* ── 1 · the cover ───────────────────────────────────────────────── */
      .cover { position: relative; min-height: 100vh; overflow: hidden; background: var(--ink); }
      .cover > img {
        position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
        animation: ed-zoom 14s ease-out both;
      }
      .cover .scrim {
        position: absolute; inset: 0;
        background: linear-gradient(192deg, rgba(20,19,15,.6) 0%, rgba(20,19,15,.5) 22%, rgba(20,19,15,.74) 52%, rgba(20,19,15,.92) 100%);
      }
      .cover .pool {
        position: absolute; left: 0; right: 0; top: 26%; height: 46%; pointer-events: none;
        background: radial-gradient(120% 100% at 18% 50%, rgba(20,19,15,.62), rgba(20,19,15,0) 72%);
      }
      .cover .inner {
        position: relative; min-height: 100vh; box-sizing: border-box;
        padding: clamp(28px, 4vw, 52px);
        display: flex; flex-direction: column; justify-content: space-between;
        animation: ed-fade 1.1s ease both;
      }
      .cover .middle { max-width: min(680px, 88vw); }
      .cover .eyebrow { font: 400 11px/1 var(--mono); letter-spacing: .3em; color: rgba(247,243,235,.72); }
      .cover h1 {
        margin: clamp(20px, 2.6vw, 34px) 0 0;
        font: 600 clamp(42px, 6.4vw, 92px)/1.04 var(--sans);
        letter-spacing: -.03em; color: var(--paper); max-width: 15ch;
      }
      .cover h1 i {
        display: inline-block; width: .12em; height: .12em; border-radius: 50%;
        background: var(--accent); margin-left: .07em;
      }
      .cover .made {
        font: 400 11px/1 var(--mono); letter-spacing: .24em; color: rgba(247,243,235,.72);
        margin-top: clamp(18px, 2vw, 28px);
      }
      .cover .bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
      .cover .enter {
        display: inline-flex; align-items: center; gap: 16px; padding: 18px 30px;
        border: 1px solid rgba(247,243,235,.45); border-radius: 999px;
        background: rgba(20,19,15,.25); color: var(--paper);
        font: 500 15px/1 var(--sans); transition: background .18s ease;
      }
      .cover .enter:hover, .cover .enter:focus-visible { background: rgba(247,243,235,.12); }
      .cover .offline {
        font: 400 10.5px/1.9 var(--mono); letter-spacing: .16em;
        color: rgba(247,243,235,.72); text-align: right;
      }

      /* ── 2 · the overview ────────────────────────────────────────────── */
      /*
        The same ground as the cover and the chapters (owner, 17 Sep 2026:
        "it looks too old school and old — give it this nice background image
        and make it very dark so the text can be white").

        One photograph, blurred behind everything, under the display's own
        angled scrim. It is the archive's own first photograph, so the three
        screens are one object rather than a paper contents page bolted to
        two dark ones.
      */
      /*
        Fades, never slides — and that is load-bearing, not taste.

        `ed-in` animates `transform`, and an element with a transform
        animation becomes the containing block for its `position: fixed`
        descendants. So the blurred ground underneath stopped being fixed,
        scrolled with the page, and at the bottom of a long overview its own
        unwashed edge appeared as a dark green band below everything. An
        opacity-only animation leaves the ground where it belongs.
      */
      .sheet { position: relative; min-height: 100vh; background: var(--dark); animation: ed-fade .5s ease both; }
      .topbar { position: relative; border-bottom: 1px solid rgba(247,243,235,.16); }
      .topbar .row {
        max-width: 1440px; margin: 0 auto; padding: 20px clamp(20px, 3.4vw, 56px);
        display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
      }
      .lockup { display: inline-flex; align-items: baseline; gap: 14px; }
      .lockup .of { font: italic 300 12.5px/1 var(--sans); color: rgba(247,243,235,.72); }
      .langbtn {
        padding: 7px 14px; border: 1px solid rgba(247,243,235,.28); border-radius: 999px;
        font: 500 11px/1 var(--mono); letter-spacing: .14em; color: rgba(247,243,235,.86);
      }
      .stamp { font: 400 11px/1 var(--mono); letter-spacing: .18em; color: rgba(247,243,235,.72); }

      .sheet main { position: relative;
        max-width: 1280px; margin: 0 auto;
        padding: clamp(48px, 6vw, 88px) clamp(20px, 4vw, 52px) clamp(72px, 8vw, 120px);
      }
      .band {
        display: flex; align-items: flex-end; justify-content: space-between;
        gap: 28px; flex-wrap: wrap; padding-bottom: 22px; border-bottom: 1px solid rgba(247,243,235,.22);
      }
      .band .eyebrow { font: 400 11px/1 var(--mono); letter-spacing: .3em; color: rgba(247,243,235,.72); }
      .band h2 { margin: 18px 0 0; font: 600 clamp(30px, 3.6vw, 46px)/1.1 var(--sans); letter-spacing: -.025em; color: var(--paper); }
      .band .hint { font: 400 11px/1.9 var(--mono); letter-spacing: .16em; color: rgba(247,243,235,.72); text-align: right; }

      .index {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: clamp(40px, 4vw, 60px) clamp(24px, 2.6vw, 36px);
        margin-top: clamp(40px, 4vw, 60px);
      }
      .card { display: flex; flex-direction: column; }
      .card .shot {
        position: relative; aspect-ratio: 4/3; overflow: hidden; border-radius: 18px;
        background: var(--backing); box-shadow: 0 16px 40px rgba(0,0,0,.34);
      }
      .card .shot img, .card .shot video { width: 100%; height: 100%; object-fit: cover; }
      /*
        The number, not a badge holding the number.

        It was a white rounded rectangle with a black numeral in it, and a
        chip is the dated part of that — a 2015 shape. The product already has
        a way of doing this: the chapter opening leads with a large light
        numeral, and the login door does the same. So the card does too. The
        numeral sits on the photograph with a short gradient under it for
        legibility, and nothing is drawn around it.
      */
      .card .shot::after {
        content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 46%;
        background: linear-gradient(to top, rgba(11,11,12,.72), rgba(11,11,12,0));
        pointer-events: none;
      }
      .card .no {
        position: absolute; left: 16px; bottom: 11px; z-index: 1;
        font: 300 clamp(30px, 3vw, 40px)/1 var(--mono); letter-spacing: -.02em;
        color: var(--paper);
      }
      .card .name { font: 600 clamp(20px, 1.8vw, 24px)/1.18 var(--sans); letter-spacing: -.012em; margin-top: 18px; color: var(--paper); }
      .card .meta { font: 400 10.5px/1 var(--mono); letter-spacing: .16em; color: rgba(247,243,235,.72); margin-top: 11px; }
      .card .about { font: 400 15.5px/1.65 var(--sans); color: rgba(247,243,235,.78); margin-top: 13px; max-width: 44ch; }
      .card:hover .name, .card:focus-visible .name { color: var(--plate-no); }

      /*
        A rule, the word, then the faces. The rule came off earlier because it
        was a bare line repeating the one above the grid; with a label on it
        it is a section heading rather than a second divider.
      */
      .peopleband {
        margin-top: clamp(64px, 7vw, 104px); padding-top: 26px;
        border-top: 1px solid rgba(247,243,235,.2);
        font: 400 11px/1 var(--mono); letter-spacing: .3em; color: rgba(247,243,235,.74);
      }
      .people {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: clamp(18px, 2vw, 28px); margin-top: clamp(26px, 3vw, 38px);
      }
      .people .one { display: flex; align-items: center; gap: 14px; }
      .people .face { width: 46px; height: 46px; border-radius: 50%; flex: none; overflow: hidden; background: var(--backing); }
      .people .face img { width: 100%; height: 100%; object-fit: cover; }
      .people .who { display: block; font: 600 15.5px/1.2 var(--sans); color: var(--paper); }
      .people .did { display: block; font: 400 12.5px/1.4 var(--sans); color: rgba(247,243,235,.72); margin-top: 4px; }

      .nothing { font: 400 16px/1.7 var(--sans); color: rgba(247,243,235,.72); margin: clamp(40px,5vw,72px) 0 0; }

      /* ── 3 · one channel, in her screen's own language ───────────────── */
      .chdark { position: relative; min-height: 100vh; background: var(--dark); animation: ed-fade .5s ease both; }
      .bgphoto { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
      .bgphoto .blur {
        position: absolute; inset: -60px; background-color: var(--backing);
        background-size: cover; background-position: center;
        filter: blur(46px) saturate(1.05); transform: scale(1.12);
      }
      /*
        The scrim is deeper than the design's first draft, and the reason is a
        measurement rather than a preference.

        At .52 the top of the page is the thinnest wash over the lightest part
        of a photograph, and the mono labels there measured 3.76:1 — under the
        4.5:1 floor, on the smallest text on the screen. My first reading said
        6.55:1 because it assumed a flat dark ground instead of compositing
        the actual photograph underneath. Deepening the first stop fixes every
        label at once, which per-label alphas would not.
      */
      .bgphoto .wash {
        position: absolute; inset: 0;
        background: linear-gradient(196deg, rgba(11,11,12,.74) 0%, rgba(11,11,12,.87) 58%, rgba(11,11,12,.96) 100%);
      }
      .chdark .hold { position: relative; max-width: 1440px; margin: 0 auto; padding: 0 clamp(20px, 3.4vw, 56px); }
      /*
        The back button sits UNDER the header rule, not in it (owner, 17 Sep
        2026: "the RECALL logo needs to always be on the same position… add a
        back button right underneath the line"). The mark was on the left of
        the overview and the right of a chapter, so it jumped across the
        screen when you opened one. Now the header is the same object on both
        and only what is beneath it changes.
      */
      /*
        The way back is a control, not two loose marks.

        An arrow and a word sitting bare under the rule read as something that
        had come off the page. The cover already establishes this product's
        shape for "press this" — a thin outlined pill — so the back button is
        the same shape at a smaller size, and the two are recognisably one
        family.
      */
      .backrow { padding: 20px 0 0; }
      .back {
        display: inline-flex; align-items: center; gap: 12px;
        padding: 10px 20px 10px 16px; border-radius: 999px;
        border: 1px solid rgba(247,243,235,.32); color: var(--paper);
        transition: background .18s ease, border-color .18s ease;
      }
      .back span { font: 400 11px/1 var(--mono); letter-spacing: .2em; color: rgba(247,243,235,.86); }
      .back:hover, .back:focus-visible { background: rgba(247,243,235,.1); border-color: rgba(247,243,235,.5); }
      .back:hover span, .back:focus-visible span { color: var(--paper); }

      /*
        The opening is one screen, and nothing else (owner: "this deserves to
        be the height of one laptop screen — give it space, let it breathe").
        Centred rather than top-aligned, so a channel with a short description
        and one with a long one both sit on the same optical line instead of
        hanging from the top bar with a field of empty underneath.
      */
      .opening {
        display: grid; grid-template-columns: minmax(0, .78fr) minmax(0, 1.22fr);
        gap: clamp(28px, 4vw, 72px); align-items: center;
        box-sizing: border-box; min-height: calc(100vh - 140px);
        padding: clamp(32px, 4vh, 64px) 0;
      }
      .opening .eyebrow { font: 400 11px/1 var(--mono); letter-spacing: .3em; color: rgba(247,243,235,.72); }
      .opening .n {
        display: block; font: 500 clamp(48px, 5.4vw, 84px)/1 var(--mono);
        color: rgba(247,243,235,.95); margin-top: clamp(16px, 1.8vw, 26px);
      }
      .opening h2 {
        margin: clamp(10px, 1.2vw, 16px) 0 0; font: 600 clamp(32px, 3.6vw, 52px)/1.06 var(--sans);
        letter-spacing: -.028em; color: var(--paper); max-width: 16ch;
      }
      .opening p.intro {
        margin: clamp(18px, 1.8vw, 26px) 0 0; font: 400 clamp(16px, 1.35vw, 19px)/1.72 var(--sans);
        color: rgba(247,243,235,.82); max-width: 40ch;
      }
      .opening .meta {
        font: 400 10.5px/1 var(--mono); letter-spacing: .18em; color: rgba(247,243,235,.72);
        margin-top: clamp(18px, 2vw, 26px);
      }

      .voice {
        margin-top: clamp(26px, 3vw, 40px); padding: 20px 22px;
        border: 1px solid rgba(247,243,235,.22); border-radius: 18px; background: rgba(11,11,12,.42);
        display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
      }
      .voice + .voice { margin-top: 14px; }
      .voice .play {
        width: 50px; height: 50px; border-radius: 50%; background: var(--accent); flex: none;
        display: inline-flex; align-items: center; justify-content: center;
      }
      .voice .play .bars { display: inline-flex; gap: 3.5px; }
      .voice .play .bars i { width: 3.5px; height: 15px; background: var(--paper); }
      .voice .body { flex: 1; min-width: 180px; }
      .voice .who { display: block; font: 400 10px/1 var(--mono); letter-spacing: .2em; color: rgba(247,243,235,.72); }
      .voice .said { display: block; font: 400 15px/1.5 var(--sans); color: rgba(247,243,235,.92); margin-top: 9px; }
      .voice .track { display: flex; align-items: center; gap: 12px; margin-top: 13px; }
      .voice .rail { flex: 1; height: 3px; background: rgba(247,243,235,.22); }
      .voice .rail i { display: block; width: 0; height: 3px; background: var(--accent); }
      .voice .time { font: 400 10.5px/1 var(--mono); color: rgba(247,243,235,.72); }

      /* Three across, two down — the rooster of small ones the owner asked
         for, and a shape that holds whether the channel has two photographs
         or two hundred. */
      .thumbs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(10px, 1.2vw, 18px); }
      .thumbs .t {
        width: 100%; aspect-ratio: 4/3; border-radius: 14px; overflow: hidden;
        background: var(--backing); box-shadow: 0 16px 40px rgba(0,0,0,.34);
      }
      .thumbs .t img, .thumbs .t video { width: 100%; height: 100%; object-fit: cover; }
      /*
        One photograph, one screen. The owner's word for what this should feel
        like was "luxurious" — which here means a single thing to look at at a
        time, with room around it, rather than a column of plates you scroll
        past. No gap between them: each already owns a full height, and a gap
        on top of that is dead space, not breathing room.
      */
      .plates { padding: 0 0 clamp(48px, 6vh, 96px); display: flex; flex-direction: column; }
      .plate {
        display: grid; grid-template-columns: minmax(0, 3.4fr) minmax(0, 1fr);
        gap: clamp(20px, 2.6vw, 44px); align-items: center;
        /* border-box, or the padding is added ON TOP of the 100vh and every
           plate spills eighty pixels past the screen it is supposed to fill. */
        box-sizing: border-box; min-height: 100vh; padding: clamp(32px, 4vh, 56px) 0;
      }
      .platefig {
        width: 100%; height: min(74vh, 720px); border-radius: 18px; overflow: hidden;
        background: var(--backing); box-shadow: 0 28px 66px rgba(0,0,0,.42);
      }
      .platefig img, .platefig video { width: 100%; height: 100%; object-fit: cover; }
      /*
        The column beside a photograph, rebuilt to say what a photograph now
        knows (059).

        The workspace asks for four things when a photograph goes in — a
        description, when, where and who is in it — and until now the archive
        printed two of them, stacked in one mono block. It prints all four,
        in the same order and under the same words the person filling it in
        saw. The caption leads, because it is the sentence somebody wrote;
        the facts sit under it as labelled rows, each a mono label over its
        value, which is the pattern the rest of the site uses for a field.
      */
      /*
        The folio, composed rather than typed out.

        It was one salmon string, "FOTO 01", which made the accent colour do
        a job it is not for — the accent is for the one thing you press, and
        a plate number is not that. The word is a label now and the numeral
        carries the weight, in the same light mono the cover and the chapter
        opening lead with. White, and bigger.
      */
      .plate .no { display: flex; align-items: baseline; gap: 10px; }
      .plate .no b {
        font: 400 9.5px/1 var(--mono); letter-spacing: .22em; font-weight: 400;
        color: rgba(247,243,235,.55);
      }
      .plate .no i {
        font: 300 clamp(22px, 2vw, 28px)/1 var(--mono); font-style: normal;
        letter-spacing: -.01em; color: var(--paper);
      }
      .plate .hair { height: 1px; background: rgba(247,243,235,.22); margin: 14px 0 0; }
      .facts { margin-top: clamp(18px, 1.8vw, 24px); display: flex; flex-direction: column; gap: clamp(15px, 1.5vw, 19px); }
      .fact .k {
        display: block; font: 400 9.5px/1 var(--mono); letter-spacing: .22em;
        color: rgba(247,243,235,.55);
      }
      .fact .v {
        display: block; margin-top: 7px; font: 400 14.5px/1.5 var(--sans);
        color: rgba(247,243,235,.92);
      }
      /* The description is a labelled row like the rest, but its value keeps
         the weight — it is the sentence somebody wrote, not a fact. */
      .fact .v.cap {
        font: 400 clamp(16px, 1.35vw, 19px)/1.6 var(--sans);
        color: var(--paper); text-wrap: pretty; margin-top: 9px;
      }

      /* One column on a phone or a narrow window. The plate's 3.4fr against
         1fr is a reading width, not a layout trick: below this it stops being
         a photograph beside its story and becomes a stripe beside a column. */
      @media (max-width: 900px) {
        .opening { grid-template-columns: minmax(0, 1fr); min-height: 0; }
        .plate { grid-template-columns: minmax(0, 1fr); min-height: 0; padding: clamp(40px,6vh,72px) 0; }
        .platefig { height: clamp(260px, 62vw, 460px); }
      }

      /* It prints as ink on paper: the dark ground goes white, the blurred
         photograph behind it is dropped, and nothing that is only a control
         comes with it. */
      @media print {
        * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        @page { size: A4; margin: 18mm 16mm; }
        html, body { background: #fff !important; }
        .no-print { display: none !important; }
        .bgphoto { display: none !important; }
        .chdark, .sheet { background: #fff !important; min-height: 0 !important; }
        .chdark *, .sheet * { color: #000 !important; box-shadow: none !important; }
        .sheet .band, .sheet .people { border-color: rgba(0,0,0,.3) !important; }
        .chdark .plate .hair { background: rgba(0,0,0,.3) !important; }
        .opening { min-height: 0 !important; }
        .plate { break-inside: avoid; page-break-inside: avoid; min-height: 0 !important; padding: 0 0 8mm !important; }
        .platefig { height: 92mm !important; border-radius: 0 !important; }
        .thumbs .t { border-radius: 0 !important; }
        .cap { color: #000 !important; font-size: 12.5pt !important; }
        .cover { min-height: 0 !important; }
        .cover > img { position: static !important; height: 120mm !important; animation: none !important; }
        .cover .scrim, .cover .pool { display: none !important; }
        .cover .inner { position: static !important; min-height: 0 !important; padding: 0 !important; animation: none !important; }
        .cover h1, .cover .eyebrow, .cover .made, .cover .mark b { color: #000 !important; }
      }
    </style>
  </head>
  <body>
    <div id="page"></div>

    <noscript>
      <div style="max-width:720px;margin:0 auto;padding:64px 24px">
        <h1 style="font:600 32px/1.2 Helvetica,Arial,sans-serif">Het archief van {{SUBJECT}}</h1>
        <p style="font:400 17px/1.7 Helvetica,Arial,sans-serif">
          Deze pagina heeft JavaScript nodig om de kanalen te tonen. Staat dat
          uit, open dan de map “Foto’s” die naast dit bestand staat — daar
          staan alle foto’s, per kanaal, met hun onderschriften.
        </p>
      </div>
    </noscript>

    <script id="archive-data" type="application/json">{{ARCHIVE_JSON}}</script>
    <script>
      (function () {
        "use strict";

        var data = JSON.parse(document.getElementById("archive-data").textContent);
        var page = document.getElementById("page");

        /*
          The page's own words, in both languages.

          Only the chrome lives here. Titles, descriptions and captions are the
          family's writing and appear exactly as they typed them, in whichever
          language they typed them.
        */
        var T = {
          fr: {
            locale: "fr-BE",
            cover: "TOUJOURS AVEC TOI", open: "Ouvrir les archives", play: "Écouter l’enregistrement",
            archiveOf: "Les archives de",
            madePrefix: "RÉALISÉ EN",
            offline1: "TOUT EST SUR CETTE CLÉ", offline2: "AUCUNE CONNEXION N’EST NÉCESSAIRE",
            overview: "APERÇU", chapters: "Les canaux", contributors: "CONTRIBUTEURS", fDesc: "DESCRIPTION", fWhen: "QUAND", fWhere: "OÙ", fWho: "QUI",
            hint1: "CLIQUEZ SUR UN CANAL", hint2: "POUR L’OUVRIR",
            back: "RETOUR",
            plate: "PHOTO ", empty: "Rien encore dans ce canal.",
            emptyArchive: "Ces archives sont encore vides. Les canaux apparaîtront ici au fur et à mesure.",
            nothingYet: "rien ajouté pour l’instant",
            recorded: "ENREGISTREMENT", recordedOn: "ENREGISTRÉ ·",
            types: { album: "ALBUM", video: "VIDÉO", documentary: "FILM", instruction: "MODE D’EMPLOI", stories: "RÉCITS" },
            photo: ["PHOTO", "PHOTOS"], voice: ["VOIX", "VOIX"],
            added: ["souvenir", "souvenirs"],
            noneYet: "ENCORE VIDE"
          },
          nl: {
            locale: "nl-NL",
            cover: "ALTIJD BIJ JE", open: "Open het archief", play: "Speel de opname af",
            /* "Het archief van Margaret" is this page speaking, not the
               family — so it follows the language switch. Her NAME never
               does. */
            archiveOf: "Het archief van",
            madePrefix: "GEMAAKT IN",
            offline1: "ALLES STAAT OP DEZE STICK", offline2: "ER IS GEEN INTERNET NODIG",
            overview: "OVERZICHT", chapters: "De kanalen", contributors: "BIJDRAGERS", fDesc: "BESCHRIJVING", fWhen: "WANNEER", fWhere: "WAAR", fWho: "WIE",
            hint1: "KLIK EEN KANAAL", hint2: "OM HET TE OPENEN",
            back: "TERUG",
            plate: "FOTO ", empty: "Nog niets in dit kanaal.",
            emptyArchive: "Dit archief is nog leeg. Zodra er kanalen bij komen, staan ze hier.",
            nothingYet: "nog niets toegevoegd",
            recorded: "OPNAME", recordedOn: "INGESPROKEN ·",
            types: { album: "ALBUM", video: "VIDEO", documentary: "FILM", instruction: "INSTRUCTIE", stories: "VERHALEN" },
            photo: ["FOTO", "FOTO’S"], voice: ["STEM", "STEMMEN"],
            /* What a contributor's line counts: everything they added, as one
               number. Not photographs and voices separately — the owner wants
               the name, how they are related, and how much they brought. */
            added: ["herinnering", "herinneringen"],
            noneYet: "NOG LEEG"
          },
          en: {
            locale: "en-GB",
            cover: "FOREVER WITH YOU", open: "Open the archive", play: "Play the recording",
            archiveOf: "The archive of",
            madePrefix: "MADE IN",
            offline1: "EVERYTHING IS ON THIS DRIVE", offline2: "NO INTERNET IS NEEDED",
            overview: "OVERVIEW", chapters: "The channels", contributors: "CONTRIBUTORS", fDesc: "DESCRIPTION", fWhen: "WHEN", fWhere: "WHERE", fWho: "WHO IS IN IT",
            hint1: "CLICK A CHANNEL", hint2: "TO OPEN IT",
            back: "BACK",
            plate: "PHOTOGRAPH ", empty: "Nothing in this channel yet.",
            emptyArchive: "This archive is still empty. Channels appear here as they are added.",
            nothingYet: "nothing added yet",
            recorded: "RECORDING", recordedOn: "RECORDED ·",
            types: { album: "ALBUM", video: "VIDEO", documentary: "FILM", instruction: "INSTRUCTION", stories: "STORIES" },
            photo: ["PHOTOGRAPH", "PHOTOGRAPHS"], voice: ["VOICE", "VOICES"],
            added: ["memory", "memories"],
            noneYet: "STILL EMPTY"
          }
        };

        /*
          Which language to open in.

          The family's own copy, so the choice is remembered — but a stick
          plugged into a strange machine must not fail because that machine
          refuses storage, and a file:// origin is exactly where browsers do
          refuse it. Both ends are wrapped; the fallback is Dutch, the
          language the archive is written in.
        */
        var LANGS = ["fr", "nl", "en"];
        var lang = "nl";
        try {
          var saved = localStorage.getItem("recall-lang");
          if (LANGS.indexOf(saved) !== -1) lang = saved;
        } catch (e) { /* no storage, no memory */ }
        function t() { return T[lang]; }
        function remember() {
          try { localStorage.setItem("recall-lang", lang); } catch (e) { /* nothing to do about it */ }
        }

        function el(tag, cls, text) {
          var n = document.createElement(tag);
          if (cls) n.className = cls;
          if (text !== undefined && text !== null && text !== "") n.textContent = text;
          return n;
        }
        function put(p, c) { p.appendChild(c); return c; }
        function pad(n) { return String(n).padStart(2, "0"); }
        function plural(n, pair) { return n + " " + (n === 1 ? pair[0] : pair[1]); }

        function picture(src, alt, kind) {
          var n;
          if (kind === "video") {
            n = el("video");
            n.setAttribute("preload", "metadata");
          } else {
            n = el("img");
            n.setAttribute("loading", "lazy");
            n.setAttribute("alt", alt || "");
          }
          n.setAttribute("src", src);
          return n;
        }

        /*
          A date, printed only as far as it was actually chosen.

          `precision` is what the family told us: a year, a month or a day.
          Every screen that writes a date in Recall is a month picker storing
          the first of the month, so printing a day by default would state a
          day nobody picked — to someone who cannot check it.
        */
        function when(iso, precision) {
          if (!iso) return null;
          var at = new Date(iso + "T00:00:00Z");
          if (isNaN(at.getTime())) return null;
          var opts = { year: "numeric", timeZone: "UTC" };
          if (precision !== "year") opts.month = "long";
          if (precision === "day") opts.day = "numeric";
          /*
            Natural case, not shouted. It used to come back upper-cased
            because its only home was a mono all-caps block; it now sits as
            the value of a labelled row, where the LABEL carries the caps and
            "3 AOÛT 1978" reads like an error message. The one place that
            still wants capitals asks for them itself.
          */
          return at.toLocaleDateString(t().locale, opts);
        }

        function madeOn(withPrefix) {
          var at = data.made_iso ? new Date(data.made_iso + "T00:00:00Z") : null;
          if (!at || isNaN(at.getTime())) return withPrefix ? (data.made_in || "") : (data.made_in_short || "");
          var month = at
            .toLocaleDateString(t().locale, { month: "long", year: "numeric", timeZone: "UTC" })
            .toUpperCase();
          return withPrefix ? t().madePrefix + " " + month : month;
        }

        function pictures(channel) {
          return channel.items.filter(function (i) { return i.kind !== "audio"; });
        }
        function voices(channel) {
          return channel.items.filter(function (i) { return i.kind === "audio"; });
        }

        /** "ALBUM · 31 FOTO'S · 2 STEMMEN" — the line under a channel's name. */
        function tally(channel) {
          var parts = [];
          var kind = t().types[channel.content_type];
          if (kind) parts.push(kind);
          var pics = pictures(channel).length;
          var said = voices(channel).length;
          if (pics) parts.push(plural(pics, t().photo));
          if (said) parts.push(plural(said, t().voice));
          if (!pics && !said) parts.push(t().noneYet);
          return parts.join(" · ");
        }

        /*
          The ground the overview and every chapter stand on: one photograph,
          blurred to 46px under the display's own angled scrim, fixed so it
          holds still while the page scrolls past it. Unreadable on purpose —
          at that radius it is warmth and colour, not a picture of anybody.
        */
        function blurredGround(parent, href) {
          if (!href) return;
          var bg = put(parent, el("div", "bgphoto"));
          var blur = put(bg, el("div", "blur"));
          blur.style.backgroundImage = 'url("' + href.replace(/"/g, "%22") + '")';
          put(bg, el("div", "wash"));
        }

        /*
          The same header on the overview and on a chapter: the mark and the
          archive's name on the left, the language switch and the stamp on the
          right. One function, so the two cannot drift apart again.
        */
        function drawHeader(parent) {
          var bar = put(parent, el("header", "topbar no-print"));
          var row = put(bar, el("div", "row"));

          var lock = put(row, el("button", "lockup"));
          lock.setAttribute("type", "button");
          markInto(lock);
          put(lock, el("span", "of", t().archiveOf + " " + data.subject));
          lock.addEventListener("click", function () { go(""); });

          var right = put(row, el("div"));
          right.style.cssText = "display:flex;align-items:center;gap:18px";
          /* One control, three languages: it names the one it will switch TO,
             and walks the ring. A see-saw label ("EN" / "NL") could not say
             where a third language was. */
          var next = LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length];
          var swap = put(right, el("button", "langbtn", next.toUpperCase()));
          swap.setAttribute("type", "button");
          swap.setAttribute("aria-label", "Taal / langue / language");
          swap.addEventListener("click", function () {
            lang = next;
            remember();
            render();
          });
          put(right, el("span", "stamp", madeOn(false)));
          return bar;
        }

        /** ← back to the overview, on its own row under the header rule. */
        function drawBack(parent) {
          var row = put(parent, el("div", "backrow no-print"));
          var back = put(row, el("button", "back"));
          back.setAttribute("type", "button");
          put(back, arrow(true));
          put(back, el("span", null, t().back));
          back.addEventListener("click", function () { go("overzicht"); });
        }

        function markInto(parent) {
          var m = put(parent, el("span", "mark"));
          put(m, el("b", null, "RECALL"));
          put(m, el("i"));
          return m;
        }

        /*
          Two arrows, and they are not the same mark.

          FORWARD is the long flat arrow the cover was drawn with — it belongs
          to "Open het archief", a one-off invitation.

          BACK is the house shape: a rule with a chevron head on a 24 grid,
          the same path the workspace's back circle draws. It used to be the
          flat arrow here too, which the owner spotted straight away — the way
          back is the same gesture everywhere in the product, so it is the
          same drawing.
        */
        function arrow(back) {
          var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          var size = back ? "15" : "22";
          svg.setAttribute("width", size);
          svg.setAttribute("height", back ? "15" : "10");
          svg.setAttribute("viewBox", back ? "0 0 24 24" : "0 0 22 10");
          svg.setAttribute("fill", "none");
          svg.setAttribute("stroke", "currentColor");
          svg.setAttribute("stroke-width", back ? "1.8" : "1.4");
          svg.setAttribute("stroke-linecap", "round");
          svg.setAttribute("stroke-linejoin", "round");
          svg.setAttribute("aria-hidden", "true");
          (back ? ["M19 12H5", "M12 19l-7-7 7-7"] : ["M0 5h20M16 1l4 4-4 4"]).forEach(function (d) {
            var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", d);
            svg.appendChild(path);
          });
          return svg;
        }

        function go(route) {
          var next = route ? "#" + route : "#";
          if (location.hash === next || (!location.hash && next === "#")) render();
          else location.hash = next;
        }

        /* ── 1 · the cover ──────────────────────────────────────────────── */
        function drawCover() {
          var wrap = put(page, el("section", "cover"));
          if (data.cover) {
            var shot = put(wrap, picture(data.cover, "", "image"));
            shot.removeAttribute("loading");
          }
          put(wrap, el("div", "scrim"));
          put(wrap, el("div", "pool"));

          var inner = put(wrap, el("div", "inner"));
          markInto(put(inner, el("div")));

          var middle = put(inner, el("div", "middle"));
          put(middle, el("div", "eyebrow", t().cover));
          var h1 = put(middle, el("h1", null, t().archiveOf + " " + data.subject));
          put(h1, el("i"));
          put(middle, el("div", "made", madeOn(true)));

          var bottom = put(inner, el("div", "bottom"));
          var enter = put(bottom, el("button", "enter"));
          enter.setAttribute("type", "button");
          put(enter, el("span", null, t().open));
          put(enter, arrow(false));
          enter.addEventListener("click", function () { go("overzicht"); });

          var off = put(bottom, el("div", "offline"));
          put(off, document.createTextNode(t().offline1));
          put(off, el("br"));
          put(off, document.createTextNode(t().offline2));
        }

        /* ── 2 · the overview ───────────────────────────────────────────── */
        function drawOverview() {
          var sheet = put(page, el("div", "sheet"));
          blurredGround(sheet, data.cover);

          drawHeader(sheet);

          var main = put(sheet, el("main"));
          var band = put(main, el("div", "band"));
          var head = put(band, el("div"));
          put(head, el("div", "eyebrow", t().overview));
          put(head, el("h2", null, t().chapters));
          var hint = put(band, el("div", "hint no-print"));
          put(hint, document.createTextNode(t().hint1));
          put(hint, el("br"));
          put(hint, document.createTextNode(t().hint2));

          if (!data.channels.length) {
            put(main, el("p", "nothing", t().emptyArchive));
          } else {
            var index = put(main, el("div", "index"));
            data.channels.forEach(function (channel) {
              var card = put(index, el("button", "card"));
              card.setAttribute("type", "button");
              var shot = put(card, el("span", "shot"));
              var first = pictures(channel)[0];
              if (first) put(shot, picture(first.href, "", first.kind));
              put(shot, el("span", "no", pad(channel.number)));
              put(card, el("span", "name", channel.title));
              put(card, el("span", "meta", tally(channel)));
              if (channel.description) put(card, el("span", "about", channel.description));
              card.addEventListener("click", function () { go(pad(channel.number)); });
            });
          }

          if (data.contributors.length) {
            put(main, el("div", "peopleband", t().contributors));
            var people = put(main, el("div", "people"));
            data.contributors.forEach(function (person) {
              var one = put(people, el("div", "one"));
              var face = put(one, el("span", "face"));
              if (person.href) put(face, picture(person.href, "", "image"));
              var side = put(one, el("span"));
              put(side, el("span", "who", person.name));
              var did = [];
              if (person.relationship) did.push(person.relationship);
              var brought = (person.photos || 0) + (person.voices || 0);
              if (brought) did.push(plural(brought, t().added));
              /* Somebody invited who has not added anything yet is still part
                 of this: the card says so rather than leaving an empty line
                 where a count should be. */
              put(side, el("span", "did", did.length ? did.join(" · ") : t().nothingYet));
            });
          }
        }

        /* ── 3 · one channel ────────────────────────────────────────────── */
        function drawVoice(parent, item) {
          var box = put(parent, el("div", "voice no-print"));
          var button = put(box, el("button", "play"));
          button.setAttribute("type", "button");
          button.setAttribute("aria-label", t().play);
          var glyph = put(button, el("span"));

          function asTriangle() {
            glyph.className = "";
            glyph.textContent = "";
            var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("width", "15"); svg.setAttribute("height", "18");
            svg.setAttribute("viewBox", "0 0 17 20"); svg.setAttribute("fill", "#F7F3EB");
            svg.setAttribute("aria-hidden", "true");
            var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", "M0 0l17 10L0 20z");
            svg.appendChild(path);
            glyph.appendChild(svg);
          }
          function asBars() {
            glyph.className = "bars";
            glyph.textContent = "";
            put(glyph, el("i"));
            put(glyph, el("i"));
          }
          asTriangle();

          var body = put(box, el("span", "body"));
          var stamp = when(item.taken_on, item.precision);
          put(body, el("span", "who", stamp ? t().recordedOn + " " + stamp.toUpperCase() : t().recorded));
          if (item.caption) put(body, el("span", "said", "“" + item.caption + "”"));
          var track = put(body, el("span", "track"));
          var rail = put(track, el("span", "rail"));
          var fill = put(rail, el("i"));
          var time = put(track, el("span", "time", "0:00"));

          var audio = el("audio");
          audio.setAttribute("preload", "metadata");
          audio.setAttribute("src", item.href);
          box.appendChild(audio);

          function clock(s) {
            if (!isFinite(s)) return "0:00";
            var m = Math.floor(s / 60), r = Math.floor(s % 60);
            return m + ":" + (r < 10 ? "0" : "") + r;
          }
          function draw() {
            var total = audio.duration;
            fill.style.width = (isFinite(total) && total > 0 ? (audio.currentTime / total) * 100 : 0) + "%";
            time.textContent = clock(audio.currentTime) + (isFinite(total) ? " / " + clock(total) : "");
          }
          audio.addEventListener("loadedmetadata", draw);
          audio.addEventListener("timeupdate", draw);
          audio.addEventListener("ended", function () { asTriangle(); draw(); });
          audio.addEventListener("pause", asTriangle);
          button.addEventListener("click", function () {
            if (audio.paused) { audio.play(); asBars(); } else { audio.pause(); }
          });
        }

        function drawChannel(channel) {
          var dark = put(page, el("div", "chdark"));
          var shots = pictures(channel);
          var lead = shots[0];

          /* The album's own first photograph, not the archive's — a chapter
             stands on its own ground. Only a photograph: a video's first
             frame is not ours to freeze. */
          if (lead && lead.kind === "image") blurredGround(dark, lead.href);

          drawHeader(dark);

          var hold = put(dark, el("div", "hold"));
          drawBack(hold);

          var opening = put(hold, el("div", "opening"));
          var left = put(opening, el("div"));
          put(left, el("div", "eyebrow", t().cover));
          put(left, el("span", "n", pad(channel.number)));
          put(left, el("h2", null, channel.title));
          if (channel.description) put(left, el("p", "intro", channel.description));
          put(left, el("div", "meta", tally(channel)));
          voices(channel).forEach(function (item) { drawVoice(left, item); });

          var right = put(opening, el("div"));
          if (shots.length) {
            var strip = put(right, el("div", "thumbs"));
            /* Six, as the design draws them — a rooster of small ones rather
               than one big plate. Every photograph gets its own full plate
               below, so the strip is a way in, not the gallery. */
            shots.slice(0, 6).forEach(function (item, i) {
              var cell = put(strip, el("button", "t"));
              cell.setAttribute("type", "button");
              cell.setAttribute("aria-label", t().plate + pad(i + 1));
              put(cell, picture(item.href, item.caption || "", item.kind));
              cell.addEventListener("click", function () {
                var target = document.getElementById("plate-" + (i + 1));
                if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
              });
            });
          }

          if (!channel.items.length) {
            var none = put(hold, el("p", "intro", t().empty));
            none.style.color = "rgba(247,243,235,.72)";
            none.style.padding = "clamp(40px,5vw,72px) 0 clamp(80px,9vw,132px)";
            return;
          }

          var plates = put(hold, el("div", "plates"));
          shots.forEach(function (item, i) {
            var plate = put(plates, el("div", "plate"));
            plate.id = "plate-" + (i + 1);
            var fig = put(plate, el("div", "platefig"));
            var media = picture(item.href, item.caption || channel.title, item.kind);
            if (item.kind === "video") media.setAttribute("controls", "");
            put(fig, media);

            var side = put(plate, el("div"));
            var folio = put(side, el("div", "no"));
            put(folio, el("b", null, t().plate.trim()));
            put(folio, el("i", null, pad(i + 1)));
            put(side, el("div", "hair"));

            /* Description, when, where, who — the four the workspace asks for
               when a photograph goes in, under the same words the person
               filling it in saw. Each is printed only when they answered it: a
               labelled row with nothing under it is worse than no row. */
            var facts = [
              [t().fDesc, item.caption, "cap"],
              [t().fWhen, when(item.taken_on, item.precision), ""],
              [t().fWhere, item.place, ""],
              [t().fWho, (item.people || []).join(" · "), ""],
            ].filter(function (row) { return row[1]; });

            if (facts.length) {
              var list = put(side, el("div", "facts"));
              facts.forEach(function (row) {
                var line = put(list, el("div", "fact"));
                put(line, el("span", "k", row[0]));
                put(line, el("span", "v" + (row[2] ? " " + row[2] : ""), row[1]));
              });
            }
          });
        }

        /* ── which screen ───────────────────────────────────────────────── */
        function render() {
          var route = (location.hash || "").replace("#", "");
          var channel = data.channels.filter(function (c) { return pad(c.number) === route; })[0];
          page.textContent = "";
          document.documentElement.setAttribute("lang", lang);
          // Every screen stands on the same dark ground now, cover included.
          document.body.style.background = "#0b0b0c";

          if (channel) drawChannel(channel);
          else if (route) drawOverview();
          else drawCover();

          window.scrollTo(0, 0);
        }

        window.addEventListener("hashchange", render);
        render();
      })();
    </script>
  </body>
</html>
